# Fly.io app configuration for the SMARTDOCS AI backend.
# Generated for manual deploy — run `fly launch --no-deploy` once to confirm
# the app name is registered to your account before your first `fly deploy`.
app = "smartdocs-ai-server"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
